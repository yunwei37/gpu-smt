[package]
description = "Native Lean REPL and source frontend process backends"
readme = "README.md"
name = "proofserve-lean"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/proofserve-lean"
include = ["src/**", "tests/**", "benches/**", "examples/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
tracing.workspace = true
proofserve-core.workspace = true
async-trait.workspace = true
tokio.workspace = true
serde_json.workspace = true
libc.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tokio-util.workspace = true
proofserve-engine.workspace = true

[package.metadata.docs.rs]
all-features = true
targets = []
rustdoc-args = ["--cfg", "docsrs"]
