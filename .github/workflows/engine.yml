name: engine

on:
  push:
    paths: ["Cargo.toml", "Cargo.lock", "crates/**", "native/**", "examples/**", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["Cargo.toml", "Cargo.lock", "crates/**", "native/**", "examples/**", ".github/workflows/engine.yml"]
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo run -p gpu-smt-engine --example failure_replay --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  native-repl-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Prepare pinned native protocol dependency
        shell: bash
        run: |
          curl -fL https://github.com/leanprover/lean4/releases/download/v4.18.0/lean-4.18.0-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/lean-4.18.0-linux/bin:$PATH"
          echo "$RUNNER_TEMP/lean-4.18.0-linux/bin" >> "$GITHUB_PATH"
          curl -fL https://codeload.github.com/leanprover-community/repl/tar.gz/2f0a3cb876b045cc0fe550ca3a625bc479816739 -o "$RUNNER_TEMP/repl.tar.gz"
          mkdir "$RUNNER_TEMP/native-repl"
          tar -xzf "$RUNNER_TEMP/repl.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/native-repl"
          cd "$RUNNER_TEMP/native-repl"
          lake build
          echo "LEAN_REPL=$RUNNER_TEMP/native-repl/.lake/build/bin/repl" >> "$GITHUB_ENV"
          echo "LEAN_PROJECT=$RUNNER_TEMP/native-repl" >> "$GITHUB_ENV"
      - name: Build import-only native parent
        run: |
          python3 native/lean/build.py --project "$LEAN_PROJECT" --sysroot "$RUNNER_TEMP/lean-4.18.0-linux" --out "$RUNNER_TEMP/prepared-host"
          echo "LEAN_PREPARED_HOST=$RUNNER_TEMP/prepared-host/prepared-host" >> "$GITHUB_ENV"
          echo "LEAN_SYSROOT=$RUNNER_TEMP/lean-4.18.0-linux" >> "$GITHUB_ENV"
      - name: Differential check against raw native JSON
        run: cargo test -p gpu-smt-lean --test native_differential --locked -- --ignored
      - name: Check native ordinary-failure transition controls
        shell: bash
        run: |
          curl -fL https://github.com/leanprover/lean4/releases/download/v4.9.0-rc1/lean-4.9.0-rc1-linux.tar.zst -o "$RUNNER_TEMP/lean49.tar.zst"
          tar --zstd -xf "$RUNNER_TEMP/lean49.tar.zst" -C "$RUNNER_TEMP"
          lean49="$RUNNER_TEMP/lean-4.9.0-rc1-linux/bin/lean"
          transition_out="$RUNNER_TEMP/failure-transition"
          mkdir -p "$transition_out"
          export LEAN_PATH="$transition_out"
          "$lean49" --root native/lean/failure-replay -T 100000 -o "$transition_out/FailureTransition.olean" native/lean/failure-replay/FailureTransition.lean
          "$lean49" --root native/lean/failure-replay/tests -T 100000 -o "$transition_out/Transition.olean" native/lean/failure-replay/tests/Transition.lean
          python3 native/lean/failure-replay/tests/differential.py --lean "$lean49" --out "$RUNNER_TEMP/failure-candidate-differential"
