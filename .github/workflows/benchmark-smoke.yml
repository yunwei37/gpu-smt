name: benchmark-smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  z3-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y z3 libz3-4

      - name: Syntax and unit tests
        run: |
          python3 -m py_compile bench/synthetic_prefix_bench.py
          python3 -m py_compile bench/libz3_state_reuse_bench.py
          python3 -m py_compile tools/analyze_smt_trace.py
          python3 -m py_compile tools/z3_capture.py
          python3 -m unittest discover -s tests -v

      - name: Run synthetic cold-vs-incremental CLI benchmark
        run: |
          mkdir -p artifacts/traces
          python3 bench/synthetic_prefix_bench.py \
            --queries 32 \
            --prefix-constraints 512 \
            --dump-dir artifacts/traces \
            --json artifacts/synthetic-cli.json

      - name: Run direct libz3 state-reuse benchmark
        run: |
          python3 bench/libz3_state_reuse_bench.py \
            --queries 32 \
            --prefix-constraints 256 \
            --json artifacts/synthetic-libz3.json

      - name: Analyze cross-query prefix reuse
        run: |
          python3 tools/analyze_smt_trace.py artifacts/traces \
            --window 64 \
            --json artifacts/trace-analysis.json

      - name: Validate benchmark output
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          cli = json.loads(Path("artifacts/synthetic-cli.json").read_text())
          lib = json.loads(Path("artifacts/synthetic-libz3.json").read_text())
          trace = json.loads(Path("artifacts/trace-analysis.json").read_text())

          assert cli["semantic_match"] is True
          assert lib["semantic_match"] is True
          assert cli["statuses"]["sat"] == 16
          assert cli["statuses"]["unsat"] == 16
          assert trace["queries"] == 32
          assert trace["nearest_recent_prefix_fraction"]["p50"] > 0.90

          print("CLI cold total s:", cli["cold"]["total_s"])
          print("CLI incremental total s:", cli["incremental"]["total_s"])
          print("CLI total speedup:", cli["speedup_total"])
          print("libz3 fresh total s:", lib["fresh"]["total_s"])
          print("libz3 reuse total s:", lib["reuse"]["total_s"])
          print("libz3 total speedup:", lib["speedup_total"])
          print("prefix p50:", trace["nearest_recent_prefix_fraction"]["p50"])
          PY

      - name: Upload smoke benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: z3-smoke-results
          path: artifacts/
