name: publish crates

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /Cargo.toml
            /Cargo.lock
            /LICENSE
            /README.md
            /.dockerignore
            /Dockerfile
            /crates/
            /native/
            /examples/
            /clients/python/
            /packaging/
          sparse-checkout-cone-mode: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Verify tag matches all package versions
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          metadata = json.loads(subprocess.check_output(["cargo", "metadata", "--no-deps", "--format-version", "1"]))
          versions = {p["version"] for p in metadata["packages"] if p["id"] in metadata["workspace_members"]}
          assert versions == {os.environ["GITHUB_REF_NAME"].removeprefix("v")}, versions
          PY
      - name: Test source before publication
        run: |
          cargo test --workspace --all-targets --locked
          cargo test --workspace --doc --locked
      - name: Verify source packages in dependency order
        run: cargo publish --workspace --dry-run --locked
      - name: Publish source packages in dependency order
        run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
