[workspace]
members = ["crates/*"]
resolver = "2"
exclude = ["bench/lean-native/linarith-oracle/reproduction/native"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/yunwei37/proofserve"
homepage = "https://github.com/yunwei37/proofserve#readme"
keywords = ["lean", "verification", "proof-assistant", "kimina", "server"]
categories = ["development-tools", "science"]

[workspace.dependencies]
async-trait = "0.1"
futures-core = "0.3"
axum = "0.8"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time", "net", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
proofserve-core = { path = "crates/proofserve-core", version = "0.1.0" }
proofserve-engine = { path = "crates/proofserve-engine", version = "0.1.0" }
proofserve-lean = { path = "crates/proofserve-lean", version = "0.1.0" }
